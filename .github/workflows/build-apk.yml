name: Build Hexaro Office APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Verify & Fetch Native Libraries (LFS Fallback)
        run: |
          cd LibreOfficeEditor/libs/arm64-v8a
          for file in *.so; do
            FILESIZE=$(stat -c%s "$file" 2>/dev/null || echo 0)
            if [ "$FILESIZE" -lt 1000 ]; then
              echo "LFS pointer detected for $file ($FILESIZE bytes). Fetching binary from upstream..."
              curl -sL --retry 3 "https://media.githubusercontent.com/media/marzaha/LibreOfficeEditor/master/LibreOfficeEditor/libs/arm64-v8a/$file" -o "$file"
            fi
            echo "$file ready (size: $(stat -c%s "$file"))"
          done

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        id: build_apk
        run: |
          START_TIME=$(date +%s)
          echo "start_time=$START_TIME" >> $GITHUB_ENV
          
          ./gradlew assembleRelease --stacktrace

          END_TIME=$(date +%s)
          DURATION_SEC=$((END_TIME - START_TIME))
          DURATION=$(printf '%dm %ds' $((DURATION_SEC/60)) $((DURATION_SEC%60)))
          echo "build_duration=$DURATION" >> $GITHUB_ENV

      - name: Prepare APK & Gather Metadata
        id: metadata
        run: |
          mkdir -p output_apk
          RAW_APK=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          
          APK_NAME="HexaroOffice-v1.0.0.apk"
          cp "$RAW_APK" "output_apk/$APK_NAME"
          
          SIZE_HUMAN=$(ls -lh "output_apk/$APK_NAME" | awk '{print $5}')
          SIZE_BYTES=$(stat -c%s "output_apk/$APK_NAME")
          
          echo "apk_path=output_apk/$APK_NAME" >> $GITHUB_ENV
          echo "apk_name=$APK_NAME" >> $GITHUB_ENV
          echo "file_size=$SIZE_HUMAN" >> $GITHUB_ENV
          echo "size_bytes=$SIZE_BYTES" >> $GITHUB_ENV
          echo "commit_short=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "author=$(git log -1 --pretty=format:'%an')" >> $GITHUB_ENV
          echo "commit_msg=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV
          echo "build_time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      - name: Publish GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.0-${{ env.commit_short }}"
          name: "Hexaro Office v1.0.0 (${{ env.commit_short }})"
          files: ${{ env.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Send APK to Telegram Channel
        run: |
          BOT_TOKEN="8711109574:AAHC5A-vZWt053OhUCYcXELDgD1u4UUsflQ"
          CHANNEL_ID="-1003938750309"
          
          REPORT="Hexaro Office APK Build Complete

• App Name: Hexaro Office
• Version: 1.0.0 (1)
• Build Type: Release
• File Size: ${{ env.file_size }}
• Branch: ${{ github.ref_name }}
• Repository: ${{ github.repository }}
• Commit: ${{ env.commit_short }}
• Author: ${{ env.author }}
• Message: ${{ env.commit_msg }}
• Build Time: ${{ env.build_time }}
• Build Duration: ${{ env.build_duration }}"

          # Telegram Bot API standard sendDocument limit is 50MB (52428800 bytes)
          if [ ${{ env.size_bytes }} -le 50000000 ]; then
            echo "Sending single APK to Telegram..."
            curl -F "chat_id=${CHANNEL_ID}" \
                 -F "document=@${{ env.apk_path }}" \
                 -F "caption=${REPORT}" \
                 "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
          else
            echo "APK size (${{ env.size_bytes }} bytes) exceeds 50MB Telegram limit. Splitting into 45MB chunks..."
            split -b 45M "${{ env.apk_path }}" "output_apk/${{ env.apk_name }}.part_"
            
            RELEASE_URL="https://github.com/${{ github.repository }}/releases"
            EXTENDED_REPORT="${REPORT}

⚠️ Direct APK exceeds 50MB. Split parts sent below (combine with: cat part_* > app.apk).
Direct 1-Click Download: ${RELEASE_URL}"
            
            curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
                 -d "chat_id=${CHANNEL_ID}" \
                 -d "text=${EXTENDED_REPORT}"
            
            for part in output_apk/${{ env.apk_name }}.part_*; do
              PART_NAME=$(basename "$part")
              echo "Uploading $PART_NAME..."
              curl -F "chat_id=${CHANNEL_ID}" \
                   -F "document=@${part}" \
                   -F "caption=${PART_NAME}" \
                   "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"
            done
          fi
